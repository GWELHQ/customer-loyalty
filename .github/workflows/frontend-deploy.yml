name: Deploy frontend to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/api-client/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: frontend-deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT_ID: customer-loyalty-3af1a
  VITE_API_BASE_URL: https://loyalty-api-1092254911440.us-central1.run.app/api/v1
  VITE_MS_ENTRA_TENANT_ID: 1ef1a63a-37ad-4132-b4b4-4a186937954c
  VITE_MS_ENTRA_CLIENT_ID: d3d57425-01fd-44e0-b14c-f0aeef62e424
  VITE_DATA_MODE: api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@loyalty/shared

      - name: Build web app
        run: npm run build --workspace=@loyalty/web

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/1092254911440/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
